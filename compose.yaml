services:

  db:
    image: mcr.microsoft.com/mssql/server:2025-latest

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd 
          -S localhost 
          -U sa 
          -P \"$${MSSQL_SA_PASSWORD}\" 
          -C 
          -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  db-init:
    image: mcr.microsoft.com/mssql/server:2025-latest

    depends_on:
      db:
        condition: service_healthy

    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    volumes:
      - ./docker/sqlserver/init.sql:/init.sql:ro

    entrypoint:
      [
        "/bin/bash",
        "-c",
        "/opt/mssql-tools18/bin/sqlcmd 
        -S db 
        -U sa 
        -P \"$$MSSQL_SA_PASSWORD\" 
        -C 
        -i /init.sql"
      ]


  app:
    build: .

    depends_on:
      db-init:
        condition: service_completed_successfully

    environment:
      DB_URL: "jdbc:sqlserver://db:1433;databaseName=FitnessTracker;encrypt=true;trustServerCertificate=true"
      DB_USERNAME: "sa"
      DB_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "8080:8080"


volumes:
  sqlserver-data: